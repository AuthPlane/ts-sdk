name: Security Audit

# Runs npm audit against the workspace dependency tree, checking each
# package's resolved dependency graph for known vulnerabilities. Any
# high-or-critical finding fails the build; accepted risks must be
# triaged explicitly (either by upgrading, applying a patch, or
# documenting with --audit-level lower for a targeted run).

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "packages/sdk/package.json"
      - "packages/mcp/package.json"
      - "packages/fastmcp/package.json"
      - ".github/workflows/security.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "packages/sdk/package.json"
      - "packages/mcp/package.json"
      - "packages/fastmcp/package.json"
      - ".github/workflows/security.yml"
  schedule:
    # Mondays 06:00 UTC — after dependabot runs.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (workspace-wide)
        # --audit-level=high: report only high + critical. Lower-severity
        # findings surface in dependabot PRs and weekly scorecard runs;
        # we fail the build only on genuinely urgent issues.
        # --omit=dev: runtime dependency graph only. Dev-only
        # vulnerabilities (build tools, test runners) don't ship.
        run: npm audit --audit-level=high --omit=dev
