name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege: CI only reads source to lint, test, and build. No job
# needs to write to the repo, so the whole workflow runs read-only.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Uses the runner's built-in git instead of actions/checkout: equivalent
      # trust for a public repo (AuthPlane/conformance), no third-party action
      # surface to SHA-pin. Keeps the catalog outside the workspace so
      # release.yml's `git add -A` cannot stage it as an embedded gitlink.
      #
      # The pinned SHA is single-sourced from `.conformance-catalog-ref` at the
      # repo root (read here after the checkout above), so ci.yml and release.yml
      # can never disagree. Bump that file — together with the SDK-side
      # conformance coverage — to adopt new catalog cases; a catalog change alone
      # can never break CI. Source: github.com/AuthPlane/conformance.
      - name: Check out shared conformance catalog (outside workspace)
        run: |
          CONFORMANCE_CATALOG_REF="$(cat "$GITHUB_WORKSPACE/.conformance-catalog-ref")"
          git init -q "${{ runner.temp }}/conformance"
          grep -Eq '^[0-9a-f]{40}$' <<<"$CONFORMANCE_CATALOG_REF" \
            || { echo "::error::.conformance-catalog-ref must be a 40-hex commit SHA"; exit 1; }
          git -C "${{ runner.temp }}/conformance" fetch --depth=1 \
            https://github.com/AuthPlane/conformance.git "$CONFORMANCE_CATALOG_REF" \
            || { echo "::error::Pinned conformance catalog ref $CONFORMANCE_CATALOG_REF is unreachable"; exit 1; }
          git -C "${{ runner.temp }}/conformance" checkout -q FETCH_HEAD

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Run coverage
        env:
          CONFORMANCE_CATALOG_PATH: ${{ runner.temp }}/conformance/oauth-sdk-conformance-catalog.yaml
        run: npm run test:coverage

      - name: Build packages
        run: npm run build

      - name: Validate npm package contents
        run: |
          cd packages/sdk && npm pack --dry-run
          cd ../mcp && npm pack --dry-run
          cd ../fastmcp && npm pack --dry-run
